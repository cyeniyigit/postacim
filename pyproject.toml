[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postacim"
dynamic = ["version"]
description = "E-posta ve takvim istemcisi — Exchange (EWS), IMAP/SMTP ve CalDAV"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Postacım geliştiricileri" }]
keywords = ["e-posta", "email", "mail", "exchange", "ews", "imap", "caldav", "takvim"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Turkish",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email :: Email Clients (MUI)",
]
dependencies = [
    "requests>=2.31",
    "requests-ntlm>=1.3",
    "sv-ttk>=2.5",
    "Pillow>=10",
    "tkinterweb>=2.5",
]

[project.urls]
Homepage = "https://github.com/cyeniyigit/postacim"
Issues = "https://github.com/cyeniyigit/postacim/issues"

[project.gui-scripts]
postacim = "postacim.__main__:main"

[tool.setuptools]
packages = ["postacim"]

[tool.setuptools.dynamic]
version = { attr = "postacim.__version__" }

[tool.setuptools.package-data]
postacim = ["ikonlar/*.png"]
