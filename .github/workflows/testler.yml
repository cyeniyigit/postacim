name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Sözdizimi kontrolü (3.10+ uyumu)
        run: python -m compileall -q postacim tests

      - name: Çevrimdışı testler
        run: |
          set -e
          xvfb-run -a python tests/coklu_hesap_test.py
          xvfb-run -a python tests/hesap_ui_test.py
          xvfb-run -a python tests/imap_yerel_sunucu_test.py
          xvfb-run -a python tests/resim_test.py
          xvfb-run -a python tests/tekrar_test.py

      - name: Paketleme kontrolü
        run: |
          pip install build
          python -m build --wheel --outdir dist/
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert any(n.endswith('ikonlar/ara.png') for n in z.namelist()), 'ikonlar eksik'"

      - name: Uygulama açılış kontrolü (başsız)
        run: |
          xvfb-run -a python -c "
          from postacim.ui import Postacim
          app = Postacim()
          app.update()
          app.destroy()
          print('arayüz açıldı')
          "

      - name: Kurulum betiği kontrolü (kur.sh)
        run: |
          ./kur.sh --gelistirici
          "$HOME/.local/share/postacim/venv/bin/python" -c "import postacim.ui; print('kurulum betiği çalıştı')"
