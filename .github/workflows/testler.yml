name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # hata olursa logu yorum olarak bırakmak için

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sözdizimi kontrolü (3.10+ uyumu)
        run: python -m compileall -q postacim tests

      - name: Xvfb hazırlığı (gerekirse)
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "xvfb bulunamadı, kuruluyor…"
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq xvfb || echo "!! xvfb kurulamadı"
          fi
          command -v xvfb-run >/dev/null 2>&1 && echo "xvfb hazır" || echo "!! xvfb yok"

      - name: Çevrimdışı testler (ekran gerektirmez)
        run: |
          set -e
          python tests/coklu_hesap_test.py 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          python tests/imap_yerel_sunucu_test.py 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Arayüz testleri (Xvfb)
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "!! xvfb yok — arayüz testleri atlandı"
            exit 0
          fi
          set -e
          xvfb-run -a python tests/hesap_ui_test.py 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          xvfb-run -a python tests/resim_test.py 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          xvfb-run -a python tests/tekrar_test.py 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Hata raporu (başarısızlıkta)
        if: failure()
        run: |
          LOG="${{ runner.temp }}/ci.log"
          {
            echo "**CI hatası — Python ${{ matrix.python }}**"
            echo
            echo '```'
            tail -80 "$LOG" 2>/dev/null || echo "(çıktı kaydedilmedi)"
            echo '```'
          } > /tmp/yorum.md
          # Sorun yoksa "CI" etiketli bir sorun aç, varsa ona yorum yap
          NUM=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues?state=open&labels=ci" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" 2>/dev/null || echo "")
          if [ -z "$NUM" ]; then
            NUM=$(curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues" \
                  -d '{"title":"CI hatası","labels":["ci"],"body":"CI çalışırken sorun oluştu; ayrıntılar aşağıda."}' \
                  | python3 -c "import json,sys; print(json.load(sys.stdin).get('number',''))" 2>/dev/null || echo "")
          fi
          if [ -n "$NUM" ]; then
            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$NUM/comments" \
              -d "$(python3 -c 'import json; print(json.dumps({"body": open("/tmp/yorum.md").read()}))')" \
              >/dev/null || true
          fi

      - name: Paketleme kontrolü
        run: |
          pip install build
          python -m build --wheel --outdir dist/
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert any(n.endswith('ikonlar/ara.png') for n in z.namelist()), 'ikonlar eksik'"

      - name: Uygulama açılış kontrolü (başsız)
        run: |
          xvfb-run -a python -c "
          from postacim.ui import Postacim
          app = Postacim()
          app.update()
          app.destroy()
          print('arayüz açıldı')
          "

      - name: Kurulum betiği kontrolü (kur.sh)
        run: |
          ./kur.sh --gelistirici
          "$HOME/.local/share/postacim/venv/bin/python" -c "import postacim.ui; print('kurulum betiği çalıştı')"
