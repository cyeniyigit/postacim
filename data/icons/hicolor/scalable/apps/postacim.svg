<?xml version="1.0" encoding="UTF-8"?>
<!-- Postacım uygulama simgesi (vektör) -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="arka" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8ce0"/>
      <stop offset="1" stop-color="#17428d"/>
    </linearGradient>
    <clipPath id="kirp">
      <rect x="0" y="0" width="256" height="256" rx="57.6" ry="57.6"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="57.6" ry="57.6" fill="url(#arka)"/>

  <g clip-path="url(#kirp)">
    <!-- üst parlaklık -->
    <ellipse cx="128" cy="-60" rx="200" ry="130" fill="#ffffff" opacity="0.12"/>

    <!-- zarf gölgesi -->
    <rect x="46.8" y="78.6" width="171.6" height="115.2" rx="14" ry="14"
          fill="#0c2858" opacity="0.35"/>
    <!-- zarf gövdesi -->
    <rect x="42.2" y="73" width="171.6" height="115.2" rx="14" ry="14" fill="#ffffff"/>

    <!-- zarf kapağı (V) -->
    <path d="M42.2 73 L128 144.2 L213.8 73 Z" fill="#b0cdf0"/>
    <path d="M42.2 73 L128 144.2 L213.8 73" fill="none" stroke="#ffffff"
          stroke-width="3.4" stroke-linejoin="round"/>
    <!-- alt kıvrımlar -->
    <path d="M42.2 188.2 L128 144.2 L213.8 188.2" fill="none" stroke="#dbe7f7"
          stroke-width="3.4" stroke-linejoin="round"/>

    <!-- pull (damga) -->
    <circle cx="188.2" cy="60.2" r="18.4" fill="#d69416"/>
    <circle cx="188.2" cy="60.2" r="15.4" fill="#ffc43d"/>
    <circle cx="188.2" cy="60.2" r="11.6" fill="none" stroke="#ffecbe" stroke-width="2"/>
  </g>
</svg>
